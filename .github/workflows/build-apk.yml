name: Build NovaBrowse

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      resync:
        description: Re-import the project source snapshot before building
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: novabrowse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository is seeded from the project's source snapshot when the sources are
      # absent, or when the workflow is dispatched with resync=true. Otherwise the
      # committed tree is authoritative and this step is skipped.
      - name: Import project sources
        if: hashFiles('app/src/main/java/com/novabrowse/browser/MainActivity.kt') == '' || inputs.resync
        env:
          SOURCE_URL: https://novabrowse-source-bootstrap-768jyb-preview.freebuff.site/novabrowse-source-2.zip
        run: |
          set -euo pipefail
          python3 - "$SOURCE_URL" <<'PY'
          import hashlib, sys, urllib.request, zipfile

          url = sys.argv[1]
          dest = "/tmp/novabrowse-source.zip"
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "NovaBrowse-CI/1.0"})
              with urllib.request.urlopen(req, timeout=90) as response, open(dest, "wb") as handle:
                  data = response.read()
                  handle.write(data)
              print(f"downloaded {len(data)} bytes from {url}")
          except Exception as exc:
              print(f"::error::Source snapshot download failed: {exc!r}")
              sys.exit(1)

          expected = open("source-snapshot.sha256").read().strip()
          actual = hashlib.sha256(data).hexdigest()
          print(f"sha256 {actual}")
          if expected and expected != actual:
              print(f"::error::Snapshot hash mismatch: expected {expected}, got {actual}")
              sys.exit(1)

          try:
              with zipfile.ZipFile(dest) as archive:
                  names = archive.namelist()
                  print(f"archive entries: {len(names)}")
                  if "app/src/main/java/com/novabrowse/browser/MainActivity.kt" not in names:
                      print("::error::Snapshot does not contain the NovaBrowse sources")
                      sys.exit(1)
                  archive.extractall(".")
          except Exception as exc:
              print(f"::error::Snapshot extraction failed: {exc!r}")
              sys.exit(1)
          print("::notice::NovaBrowse sources imported from the project snapshot")
          PY
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Commit imported sources
        run: |
          git config user.name "NovaBrowse import"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Import NovaBrowse Android sources and CI configuration"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "Using Android SDK at $SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls "$SDK_ROOT/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Prepare Gradle wrapper
        run: |
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties release.keystore

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/unit-tests.log

      - name: Report failed checks
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          def emit(message):
              print("::error::" + " ".join(str(message).split())[:1400])

          reported = False
          for path in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  problems = list(case.findall("failure")) + list(case.findall("error"))
                  for problem in problems:
                      lines = (problem.get("message") or problem.text or "").strip().splitlines()
                      emit(f"test {case.get('classname')}.{case.get('name')}: {lines[0] if lines else 'failed'}")
                      reported = True
          if reported:
              raise SystemExit(0)

          log = "/tmp/unit-tests.log"
          if not os.path.exists(log):
              emit("Gradle did not run: the workflow failed before the test task started")
              raise SystemExit(0)

          log_lines = open(log, errors="replace").read().splitlines()
          start = next((i for i, line in enumerate(log_lines) if line.startswith("FAILURE:")), None)
          if start is not None:
              emit(" | ".join(line.strip() for line in log_lines[start:start + 20]))
          else:
              picked = [line.strip() for line in log_lines if line.startswith("e: ") or "error: " in line or line.strip().startswith("Caused by:")][:10]
              if picked:
                  emit(" | ".join(picked))
              else:
                  emit(" | ".join(line.strip() for line in log_lines[-25:]))
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --console=plain

      - name: Build release APK (signed when secrets are configured)
        run: ./gradlew assembleRelease --stacktrace --no-daemon --console=plain
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NovaBrowse-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/NovaBrowse-release.apk
          fi
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowse-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Publish APK release
        if: github.event_name == 'push' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('NovaBrowse {0}', github.ref_name) || 'NovaBrowse continuous build' }}
          body: |
            NovaBrowse — **BROWSE BEYOND.**

            Automated build from `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            * `NovaBrowse-debug.apk` — installable debug build, signed with the Android debug key.
            * `NovaBrowse-release.apk` — release build; attached only when repository signing secrets are configured.

            This build uses the Chrome-style interface (top tab strip, omnibox toolbar, overflow menu,
            grouped settings) with shorter, smoother screen transitions.
          files: dist/*.apk
          fail_on_unmatched_files: false
          make_latest: true
