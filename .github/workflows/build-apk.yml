name: Build NovaBrowse

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novabrowse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository is seeded from the project's source snapshot the first time this
      # workflow runs. After that the committed tree is authoritative and this step is a no-op.
      - name: Import project sources
        run: |
          if [ ! -d app/src/main/java/com/novabrowse/browser ]; then
            curl -fsSL --retry 5 --retry-delay 4 -o /tmp/novabrowse-source.zip "$SOURCE_URL"
            if [ -f source-snapshot.sha256 ]; then
              echo "$(cat source-snapshot.sha256)  /tmp/novabrowse-source.zip" | sha256sum -c -
            fi
            unzip -q -o /tmp/novabrowse-source.zip -d .
          fi
        env:
          SOURCE_URL: https://novabrowse-source-bootstrap-768jyb-preview.freebuff.site/novabrowse-source.zip

      - name: Commit imported sources
        run: |
          git config user.name "NovaBrowse import"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Import NovaBrowse Android sources and CI configuration"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Prepare Gradle wrapper
        run: |
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties release.keystore

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK (signed when secrets are configured)
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NovaBrowse-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/NovaBrowse-release.apk
          fi
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowse-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Publish APK release
        if: github.event_name == 'push' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('NovaBrowse {0}', github.ref_name) || 'NovaBrowse continuous build' }}
          body: |
            NovaBrowse — **BROWSE BEYOND.**

            Automated build from `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            * `NovaBrowse-debug.apk` — installable debug build, signed with the Android debug key.
            * `NovaBrowse-release.apk` — release build; attached only when repository signing secrets are configured.
          files: dist/*.apk
          fail_on_unmatched_files: false
          make_latest: true
